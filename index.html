<meta charset="UTF-8" />

<title>CleanGo247</title>
<meta name="theme-color" content="#E8432F" />
<meta name="description" content="CleanGo247 - Dịch vụ rửa chén theo tháng" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap');
  :root { --sab: env(safe-area-inset-bottom, 0px); --sat: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; background: #FAFAF7; overscroll-behavior: none; }
  body { font-family: 'Be Vietnam Pro', sans-serif; }
  #root { height: 100dvh; height: 100vh; width: 100vw; position: relative; overflow: hidden; background: #FAFAF7; }
  button { font-family: inherit; }
  input, textarea { font-family: inherit; }
  .hide-scroll::-webkit-scrollbar { display: none; }
  .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
  .spin { animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .screen-enter { animation: screenIn 0.32s cubic-bezier(0.22, 1, 0.36, 1) both; }
  @keyframes screenIn {
    from { opacity: 0; transform: translateX(18px) scale(0.99); }
    to { opacity: 1; transform: translateX(0) scale(1); }
  }
  @media (prefers-reduced-motion: reduce) {
    .screen-enter, .spin { animation: none !important; }
  }
  button:active { transform: scale(0.97); }
  #splash { position: fixed; inset: 0; background: #171310; display: flex; align-items: center; justify-content: center; z-index: 9999; transition: opacity 0.4s ease; }
  #splash img { width: 84px; height: 84px; object-fit: contain; border-radius: 20px; background: #fff; padding: 10px; box-sizing: border-box; }
</style>
</head>

function useDateStrip() {
  return useMemo(() => {
    const wd = ["CN", "T2", "T3", "T4", "T5", "T6", "T7"];
    const out = [];
    const base = new Date(2026, 6, 22); // Jul 22, 2026
    for (let i = 0; i < 9; i++) {
      const d = new Date(base);
      d.setDate(base.getDate() + i);
      out.push({ day: wd[d.getDay()], date: d.getDate(), month: d.getMonth() + 1, key: i });
    }
    return out;
  }, []);
}

function BottomNav({ active, onSelect }) {
  const items = [
    { key: "home", icon: Home, label: "Trang chủ" },
    { key: "history", icon: CalendarDays, label: "Lịch rửa" },
    { key: "scan", icon: ClipboardList, label: "Đăng ký" },
    { key: "support", icon: Sparkles, label: "Hỗ trợ" },
    { key: "plan", icon: User, label: "Tài khoản" },
  ];
  return (
    <div
      style={{
        position: "absolute",
        bottom: 0,
        left: 0,
        right: 0,
        background: "#FFFFFF",
        borderTop: `1px solid ${COLOR.mist}`,
        display: "flex",
        justifyContent: "space-around",
        alignItems: "center",
        padding: "10px 6px calc(14px + var(--sab, 0px))",
      }}
    >
      {items.map(({ key, icon: Icon, label }) => {
        const isActive = key === active;
        if (key === "scan") {
          return (
            <button
              key={key}
              onClick={() => onSelect(key)}
              style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 3, width: 60, background: "none", border: "none", cursor: "pointer", marginTop: -30 }}
            >
              <div
                style={{
                  width: 52,
                  height: 52,
                  borderRadius: "50%",
                  background: COLOR.red,
                  display: "flex",
                  alignItems: "center",
                  justifyContent: "center",
                  border: "4px solid #fff",
                  boxShadow: "0 6px 14px rgba(232,67,47,0.4)",
                }}
              >
                <Icon size={22} color="#fff" strokeWidth={2.2} />
              </div>
              <span style={{ fontFamily: DISPLAY_FONT, fontSize: 10, fontWeight: 700, color: COLOR.red }}>{label}</span>
            </button>
          );
        }
        return (
          <button
            key={key}
            onClick={() => onSelect(key)}
            style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 3, width: 60, background: "none", border: "none", cursor: "pointer" }}
          >
            <Icon size={20} color={isActive ? COLOR.red : "#B9B3A6"} strokeWidth={isActive ? 2.4 : 2} />
            <span style={{ fontFamily: DISPLAY_FONT, fontSize: 10, fontWeight: isActive ? 700 : 500, color: isActive ? COLOR.red : "#B9B3A6" }}>{label}</span>
          </button>
        );
      })}
    </div>
  );
}

function ScreenHeader({ eyebrow, title, sub, onBack }) {
  return (
    <div style={{ padding: "22px 20px 6px", display: "flex", alignItems: "flex-start", gap: 10 }}>
      {onBack && (
        <button onClick={onBack} style={{ width: 28, height: 28, borderRadius: 9, background: "#fff", border: `1px solid ${COLOR.mist}`, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0, marginTop: 2, cursor: "pointer" }}>
          <ChevronLeft size={15} color={COLOR.ink} />
        </button>
      )}
      <div>
        {eyebrow && (
          <div style={{ fontFamily: DISPLAY_FONT, fontSize: 11, fontWeight: 700, letterSpacing: "0.08em", color: COLOR.red, textTransform: "uppercase", marginBottom: 4 }}>
            {eyebrow}
          </div>

// ---------- AI Scan (multi-angle capture) ----------
function ScanScreen({ goTo, goToTab }) {
  const ANGLES = ["Góc trên", "Góc nghiêng trái", "Góc nghiêng phải"];
  const [shots, setShots] = useState(0);
  const [scanning, setScanning] = useState(false);
  const done = shots >= ANGLES.length;

  const capture = () => {
    setScanning(true);
    setTimeout(() => {
      setScanning(false);
      setShots((s) => Math.min(ANGLES.length, s + 1));
    }, 700);
  };

  return (
    <div style={{ flex: 1, display: "flex", flexDirection: "column" }}>
      <ScreenHeader eyebrow="AI" title="Quét chén bằng ảnh" sub="Chụp đủ 3 góc để AI nhận diện chính xác hơn" />
      <div style={{ padding: "10px 20px", display: "flex", flexDirection: "column", gap: 12, flex: 1 }}>
        <div style={{ position: "relative", borderRadius: 20, overflow: "hidden", height: 290, background: "linear-gradient(160deg,#2B2622,#171310)", display: "flex", alignItems: "center", justifyContent: "center" }}>
          {["tl", "tr", "bl", "br"].map((pos) => (
            <div
              key={pos}
              style={{
                position: "absolute",
                width: 22,
                height: 22,
                borderColor: "#fff",
                borderStyle: "solid",
                top: pos.includes("t") ? 16 : undefined,
                bottom: pos.includes("b") ? 16 : undefined,
                left: pos.includes("l") ? 16 : undefined,
                right: pos.includes("r") ? 16 : undefined,
                borderWidth: `${pos.includes("t") ? 2.5 : 0}px ${pos.includes("r") ? 2.5 : 0}px ${pos.includes("b") ? 2.5 : 0}px ${pos.includes("l") ? 2.5 : 0}px`,
                borderTopLeftRadius: pos === "tl" ? 6 : 0,
                borderTopRightRadius: pos === "tr" ? 6 : 0,
                borderBottomLeftRadius: pos === "bl" ? 6 : 0,
                borderBottomRightRadius: pos === "br" ? 6 : 0,
              }}
            />
          ))}
          <div style={{ position: "absolute", top: 14, left: 0, right: 0, display: "flex", justifyContent: "center", gap: 8 }}>
            {ANGLES.map((a, i) => (
              <div key={a} style={{ padding: "4px 10px", borderRadius: 100, background: i < shots ? COLOR.sage : i === shots && !done ? COLOR.red : "rgba(255,255,255,0.14)", display: "flex", alignItems: "center", gap: 4 }}>
                {i < shots && <Check size={10} color="#fff" />}
                <span style={{ fontFamily: DISPLAY_FONT, fontSize: 9.5, fontWeight: 700, color: "#fff" }}>{a}</span>
              </div>
            ))}
          </div>
          {!done && !scanning && (
            <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 8 }}>
              <Camera size={30} color="#B9B3A6" />
              <span style={{ fontFamily: DISPLAY_FONT, fontSize: 11.5, color: "#B9B3A6" }}>Chụp góc {shots + 1}/{ANGLES.length}: {ANGLES[shots]}</span>
            </div>
          )}
          {scanning && (
            <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 10 }}>
              <div className="spin" style={{ width: 34, height: 34, borderRadius: "50%", border: "3px solid rgba(255,255,255,0.25)", borderTopColor: COLOR.red }} />
              <span style={{ fontFamily: DISPLAY_FONT, fontSize: 11.5, color: "#EDEAE3" }}>Đang lưu ảnh...</span>
            </div>
          )}
          {done && !scanning && (
            <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 10 }}>
              <div style={{ width: 46, height: 46, borderRadius: "50%", background: COLOR.sageSoft, display: "flex", alignItems: "center", justifyContent: "center" }}>
                <Check size={22} color={COLOR.sage} strokeWidth={3} />
              </div>
              <span style={{ fontFamily: DISPLAY_FONT, fontSize: 11.5, color: "#EDEAE3" }}>Đã chụp đủ 3 góc</span>
            </div>
          )}
        </div>
        <div style={{ fontFamily: DISPLAY_FONT, fontSize: 10.5, color: COLOR.inkSoft, textAlign: "center", lineHeight: 1.4 }}>
          Kết hợp nhiều góc chụp giúp AI nhận diện số lượng chính xác hơn.
        </div>
        {!done ? (
          <button onClick={capture} disabled={scanning} style={{ alignSelf: "center", width: 62, height: 62, borderRadius: "50%", background: COLOR.red, border: "5px solid " + COLOR.redSoft, cursor: scanning ? "default" : "pointer", opacity: scanning ? 0.6 : 1 }} />
        ) : (
          <button onClick={() => goTo("result")} style={{ background: COLOR.red, color: "#fff", border: "none", borderRadius: 16, padding: "13px 0", fontFamily: DISPLAY_FONT, fontWeight: 700, fontSize: 13.5, cursor: "pointer" }}>
            Xem kết quả nhận diện
          </button>
        )}
      </div>
      <BottomNav active="scan" onSelect={goToTab} />
    </div>
  );
}

function ScheduleScreen({ goTo, goToTab }) {
  const days = useDateStrip();
  const [selectedDay, setSelectedDay] = useState(2);
  const [hour, setHour] = useState(18);
  const [name, setName] = useState("");
  const [phone, setPhone] = useState("");
  const [address, setAddress] = useState("");
  const [ward] = useState("Phường");
  const [province] = useState("Tỉnh / Thành phố");

  const HOURS = [6, 8, 10, 12, 14, 16, 18, 20, 22];
  const cx = 130, cy = 138, r = 106;
  const posFor = (h) => {
    const f = (h - 6) / 16;
    const angle = Math.PI - f * Math.PI;
    return { x: cx + r * Math.cos(angle), y: cy - r * Math.sin(angle) };
  };
  const trackPoints = useMemo(() => {
    const pts = [];
    for (let i = 0; i <= 40; i++) {
      const f = i / 40;
      const angle = Math.PI - f * Math.PI;
      pts.push(`${cx + r * Math.cos(angle)},${cy - r * Math.sin(angle)}`);
    }
    return pts.join(" ");
  }, []);
  const selPos = posFor(hour);

  return (
    <div style={{ flex: 1, display: "flex", flexDirection: "column" }}>
      <ScreenHeader eyebrow="Thiết lập" title="Lịch rửa chén" sub="Chọn ngày bắt đầu và khung giờ nhận chén mỗi ngày" />
      <div style={{ padding: "12px 20px", display: "flex", flexDirection: "column", gap: 16, flex: 1, overflowY: "auto" }}>
        <div>
          <div style={{ fontFamily: DISPLAY_FONT, fontSize: 11.5, fontWeight: 700, color: COLOR.ink, marginBottom: 8 }}>Thông tin khách hàng</div>
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 8, border: `1px solid ${COLOR.mist}`, borderRadius: 12, padding: "9px 12px", background: "#fff" }}>
              <User size={14} color={COLOR.inkSoft} />
              <input value={name} onChange={(e) => setName(e.target.value)} placeholder="Họ và tên" style={{ flex: 1, border: "none", outline: "none", fontFamily: DISPLAY_FONT, fontSize: 12, color: COLOR.ink }} />
            </div>
            <div style={{ display: "flex", alignItems: "center", gap: 8, border: `1px solid ${COLOR.mist}`, borderRadius: 12, padding: "9px 12px", background: "#fff" }}>
              <Phone size={14} color={COLOR.inkSoft} />
              <input value={phone} onChange={(e) => setPhone(e.target.value)} placeholder="Số điện thoại" style={{ flex: 1, border: "none", outline: "none", fontFamily: DISPLAY_FONT, fontSize: 12, color: COLOR.ink }} />
            </div>
            <div style={{ display: "flex", alignItems: "center", gap: 8, border: `1px solid ${COLOR.mist}`, borderRadius: 12, padding: "9px 12px", background: "#fff" }}>
              <MapPin size={14} color={COLOR.inkSoft} />
              <input value={address} onChange={(e) => setAddress(e.target.value)} placeholder="Địa chỉ nhận chén" style={{ flex: 1, border: "none", outline: "none", fontFamily: DISPLAY_FONT, fontSize: 12, color: COLOR.ink }} />
            </div>
            <div style={{ display: "flex", gap: 8 }}>
              <button style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "space-between", gap: 6, border: `1px solid ${COLOR.mist}`, borderRadius: 12, padding: "9px 12px", background: "#fff", cursor: "pointer" }}>
                <span style={{ fontFamily: DISPLAY_FONT, fontSize: 12, color: "#B9B3A6" }}>{ward}</span>
                <ChevronDown size={13} color={COLOR.inkSoft} />
              </button>
              <button style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "space-between", gap: 6, border: `1px solid ${COLOR.mist}`, borderRadius: 12, padding: "9px 12px", background: "#fff", cursor: "pointer" }}>
                <span style={{ fontFamily: DISPLAY_FONT, fontSize: 12, color: "#B9B3A6" }}>{province}</span>
                <ChevronDown size={13} color={COLOR.inkSoft} />
              </button>
            </div>
          </div>
        </div>

        <div>
          <div style={{ fontFamily: DISPLAY_FONT, fontSize: 11.5, fontWeight: 700, color: COLOR.ink, marginBottom: 8 }}>Ngày bắt đầu</div>
          <div className="hide-scroll" style={{ display: "flex", gap: 8, overflowX: "auto" }}>
            {days.map((d) => {
              const active = d.key === selectedDay;
              return (
                <button key={d.key} onClick={() => setSelectedDay(d.key)} style={{ flexShrink: 0, width: 46, padding: "9px 0", borderRadius: 14, border: active ? `1.5px solid ${COLOR.red}` : `1.5px solid ${COLOR.mist}`, background: active ? COLOR.redSoft : "#fff", display: "flex", flexDirection: "column", alignItems: "center", gap: 2, cursor: "pointer" }}>
                  <span style={{ fontFamily: DISPLAY_FONT, fontSize: 9.5, color: active ? COLOR.red : COLOR.inkSoft, fontWeight: 600 }}>{d.day}</span>
                  <span style={{ fontFamily: MONO_FONT, fontSize: 13, color: active ? COLOR.red : COLOR.ink, fontWeight: 700 }}>{d.date}</span>
                </button>
              );
            })}
          </div>
        </div>

        <div style={{ background: "#fff", border: `1px solid ${COLOR.mist}`, borderRadius: 20, padding: "16px 10px 8px", display: "flex", flexDirection: "column", alignItems: "center" }}>
          <div style={{ fontFamily: DISPLAY_FONT, fontSize: 11.5, fontWeight: 700, color: COLOR.ink, alignSelf: "flex-start", marginLeft: 8 }}>Khung giờ rửa mỗi ngày</div>
          <svg width={260} height={162} viewBox="0 0 260 162">
            <polyline points={trackPoints} fill="none" stroke={COLOR.mistDark} strokeWidth={3} strokeLinecap="round" />
            {HOURS.map((h) => {
              const p = posFor(h);
              const active = h === hour;
              return (
                <g key={h} style={{ cursor: "pointer" }} onClick={() => setHour(h)}>
                  <circle cx={p.x} cy={p.y} r={active ? 9 : 5} fill={active ? COLOR.red : "#fff"} stroke={active ? COLOR.red : COLOR.mistDark} strokeWidth={2} />
                  <text x={p.x} y={p.y - 14} textAnchor="middle" fontFamily={MONO_FONT} fontSize="9.5" fill={active ? COLOR.red : COLOR.inkSoft} fontWeight={active ? 700 : 500}>{h}h</text>
                </g>
              );
            })}
            <line x1={cx} y1={cy} x2={selPos.x} y2={selPos.y} stroke={COLOR.red} strokeWidth={2} strokeDasharray="3 3" />
            <circle cx={cx} cy={cy} r={4} fill={COLOR.ink} />
          </svg>
          <div style={{ display: "flex", alignItems: "baseline", gap: 6, marginBottom: 6 }}>
            <Clock size={15} color={COLOR.red} />
            <span style={{ fontFamily: MONO_FONT, fontSize: 24, fontWeight: 700, color: COLOR.ink }}>{String(hour).padStart(2, "0")}:00</span>
          </div>
          <div style={{ fontFamily: DISPLAY_FONT, fontSize: 11, color: COLOR.inkSoft, marginBottom: 10, textAlign: "center", padding: "0 12px" }}>
            Nhân viên sẽ đến trong khung {String(hour).padStart(2, "0")}:00 – {String(hour).padStart(2, "0")}:30 mỗi ngày
          </div>
        </div>

        <button onClick={() => goTo("booking-success")} style={{ background: COLOR.red, color: "#fff", border: "none", borderRadius: 16, padding: "14px 0", fontFamily: DISPLAY_FONT, fontWeight: 700, fontSize: 14, cursor: "pointer" }}>
          Xác nhận lịch rửa
        </button>
      </div>
      <BottomNav active="scan" onSelect={goToTab} />
    </div>
  );
}

function CheckoutScreen({ goToTab }) {
  const [method, setMethod] = useState("momo");

  const methods = [

  const pay = () => {
    setStatus("processing");

  if (status === "success") {
    return (

        </div>
        <div style={{ fontFamily: DISPLAY_FONT, fontSize: 11.5, fontWeight: 700, color: COLOR.ink }}>Phương thức thanh toán</div>
        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>

    </div>
  );

  const [messages, setMessages] = useState([
    { from: "agent", text: "Chào bạn 👋 CleanGo247 có thể giúp gì cho bạn hôm nay?" },
    { from: "user", text: "Cho mình hỏi hôm nay nhân viên mấy giờ tới ạ?" },
    { from: "agent", text: "Dạ nhân viên sẽ đến trong khung 18:00 – 18:30 hôm nay ạ." },
  ]);
  const [draft, setDraft] = useState("");

  const send = () => {
    if (!draft.trim()) return;
    setMessages((m) => [...m, { from: "user", text: draft.trim() }]);
    setDraft("");
    setTimeout(() => {
      setMessages((m) => [...m, { from: "agent", text: "Cảm ơn bạn, đội ngũ CSKH sẽ phản hồi trong ít phút." }]);
    }, 700);
  };

  return (
    <div style={{ flex: 1, display: "flex", flexDirection: "column" }}>
      <ScreenHeader onBack={onBack} eyebrow="CSKH 24/7" title="Hỗ trợ" sub="Đội ngũ CleanGo247 luôn sẵn sàng" />
      <div style={{ padding: "8px 20px", display: "flex", flexDirection: "column", gap: 10, flex: 1, overflowY: "auto" }}>
        {messages.map((m, i) => (
          <div key={i} style={{ display: "flex", justifyContent: m.from === "user" ? "flex-end" : "flex-start" }}>
            <div
              style={{
                maxWidth: "78%",
                background: m.from === "user" ? COLOR.red : "#fff",
                color: m.from === "user" ? "#fff" : COLOR.ink,
                border: m.from === "user" ? "none" : `1px solid ${COLOR.mist}`,
                borderRadius: 16,
                padding: "9px 13px",
                fontFamily: DISPLAY_FONT,
                fontSize: 12,
                lineHeight: 1.45,
              }}
            >
              {m.text}
            </div>
          </div>
        ))}
      </div>
      <div style={{ display: "flex", alignItems: "center", gap: 8, padding: "10px 16px 16px", borderTop: `1px solid ${COLOR.mist}` }}>
        <div style={{ flex: 1, display: "flex", alignItems: "center", border: `1px solid ${COLOR.mist}`, borderRadius: 100, padding: "9px 14px" }}>
          <input
            value={draft}
            onChange={(e) => setDraft(e.target.value)}
            onKeyDown={(e) => e.key === "Enter" && send()}
            placeholder="Nhập tin nhắn..."
            style={{ flex: 1, border: "none", outline: "none", fontFamily: DISPLAY_FONT, fontSize: 12, color: COLOR.ink }}
          />
        </div>
        <button onClick={send} style={{ width: 38, height: 38, borderRadius: "50%", background: COLOR.red, border: "none", display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", flexShrink: 0 }}>
          <Send size={16} color="#fff" />
        </button>
      </div>
    </div>
  );
}

const SCREENS = {
  onboarding: OnboardingScreen,
  login: LoginScreen,
  register: RegisterScreen,
  home: HomeScreen,
  notifications: NotificationsScreen,
  scan: ScanScreen,
  result: ResultScreen,
  schedule: ScheduleScreen,
  "booking-success": BookingSuccessScreen,
  checkout: CheckoutScreen,
  plan: PlanScreen,
  history: HistoryScreen,
  support: ChatScreen,
};


function App() {
  const [screen, setScreen] = useState("onboarding");
  const [stack, setStack] = useState([]);

  const goTo = (next) => {
    setStack((s) => [...s, screen]);
    setScreen(next);
  };
  const goToTab = (next) => {
    setStack([]);
    setScreen(next);
  };
  const goBack = () => {
    setStack((s) => {
      if (s.length === 0) {
        setScreen("home");
        return s;
      }
      const prev = s[s.length - 1];
      setScreen(prev);
      return s.slice(0, -1);
    });
  };

  const Screen = SCREENS[screen];

  return (
    <div className="app-shell" style={{ height: "100%", width: "100%", background: COLOR.foam, position: "relative", display: "flex", flexDirection: "column", paddingTop: "var(--sat, 0px)" }}>
      <div key={screen} className="screen-enter" style={{ display: "flex", flexDirection: "column", flex: 1, minHeight: 0 }}>
        <Screen goTo={goTo} goToTab={goToTab} onBack={goBack} />
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);

// Hide the native-feeling splash once React has painted the first screen
requestAnimationFrame(() => {
  requestAnimationFrame(() => {
    const el = document.getElementById("splash");
    if (el) {
      el.style.opacity = "0";
      setTimeout(() => el.remove(), 400);
    }
  });
});
</script>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }
</script>
